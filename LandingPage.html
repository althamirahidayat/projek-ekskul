    /* --- KOLOM KANAN: IMAGE SLIDER --- */
    .slider-section {
      flex: 1.5; /* Lebih lebar dari kolom login */

    /* Wrapper untuk sliding effect */
    .slider-wrapper {
      display: flex;
      width: 500%; /* 5 gambar x 100% */
      height: 100%;
      transition: transform 0.8s ease-in-out;
    }

    /* Style setiap slide */
    .slider-image-container {
      width: 20%; /* 100% / 5 gambar */
      flex-shrink: 0;
      height: 100%;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 30px;
      position: relative;
    }
    
    .slide-caption {
        background: rgba(13, 71, 161, 0.7); /* Menggunakan var(--color-primary) dengan opacity */

        padding: 10px 20px;
        border-radius: 10px;

    /* Indikator Slider */

    .dot {

    /* --- ANIMASI --- */

    /* --- RESPONSIVENESS (Mobile/Tablet) --- */

<body>

        <div class="slider-image-container" data-image="pic/ballet.jpeg">

          <div class="dot active" data-slide="0"></div>
          <div class="dot" data-slide="1"></div>
          <div class="dot" data-slide="2"></div>
          <div class="dot" data-slide="3"></div>
          <div class="dot" data-slide="4"></div>
      </div>
    </section>

  </div>

  <script>
    const sliderWrapper = document.getElementById('sliderWrapper');
    const slides = document.querySelectorAll('.slider-image-container');
    const indicatorsContainer = document.getElementById('sliderIndicators');
    const dots = document.querySelectorAll('.dot');
    let currentIndex = 0;
    const totalSlides = slides.length;
    const intervalTime = 4500; // 4.5 detik per slide
    let slideInterval; // Dideklarasikan di scope luar agar bisa diakses oleh resetInterval

    // Fungsi untuk memuat gambar dari data-attribute dan menggeser slide
    function goToSlide(index) {
        // Handle wrapping around
        if (index >= totalSlides) {
            index = 0;
        } else if (index < 0) {
            index = totalSlides - 1;
        }

        // Update index
        currentIndex = index;
        
        // Hitung offset geser
        const offset = -currentIndex * 100 / totalSlides;
        sliderWrapper.style.transform = `translateX(${offset}%)`;

        // Update indikator (dots)
        dots.forEach((dot, i) => {
            dot.classList.toggle('active', i === currentIndex);
        });
        
        // Memastikan background image sudah dimuat
        // Note: Ini dilakukan di onload, tapi tetap aman jika dipanggil di sini juga
        const imageUrl = slides[currentIndex].getAttribute('data-image');
        if (slides[currentIndex].style.backgroundImage === '') {
             slides[currentIndex].style.backgroundImage = `url('${imageUrl}')`;
        }
    }

    // Fungsi untuk menggeser ke slide berikutnya secara otomatis
    function nextSlide() {
      const nextIndex = (currentIndex + 1) % totalSlides;
      goToSlide(nextIndex);
    }

    // Reset interval saat ada interaksi user
    function resetInterval() {
        clearInterval(slideInterval);
        slideInterval = setInterval(nextSlide, intervalTime);
    }

    // Event listener untuk klik pada indikator
    indicatorsContainer.addEventListener('click', (e) => {
        if (e.target.classList.contains('dot')) {
            const slideIndex = parseInt(e.target.getAttribute('data-slide'));
            resetInterval();
            goToSlide(slideIndex);
        }
    });

    // Inisialisasi: Muat semua gambar dan mulai slider saat halaman dimuat
    window.onload = () => {
        slides.forEach(slide => {
            const imageUrl = slide.getAttribute('data-image');
            // Mengatur background image untuk semua slide
            slide.style.backgroundImage = `url('${imageUrl}')`;
        });
        
        // Pastikan slide pertama aktif dan tampil
        goToSlide(0); 
        
        // Mulai otomatisasi slider
        slideInterval = setInterval(nextSlide, intervalTime);
    };

  </script>
